# Release-note categories for `gh release create --generate-notes`
# (.github/workflows/release.yml). Labels come from pr-conventional-labeler.yml.
changelog:
  exclude:
    labels:
      - chore
  categories:
    - title: Features
      labels:
        - feat
    - title: Bug Fixes
      labels:
        - fix
    - title: Documentation
      labels:
        - docs
    - title: Performance Improvements
      labels:
        - perf
    - title: Code Refactoring
      labels:
        - refactor
    - title: Other Changes
      labels:
        - "*"
