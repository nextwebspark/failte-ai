[project]
name = "fallcha-tools"
version = "0.1.0"
description = "Fallcha.ai tools service: hosted third-party tool providers exposed over MCP."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135,<0.136",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.43,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.16,<1.17",
    "cryptography>=44",
    "httpx>=0.28",
    "fastmcp>=4.0.10,<5",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fallcha_tools"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
