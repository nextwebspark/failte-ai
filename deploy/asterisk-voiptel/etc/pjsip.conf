; Voiptel / SkyPhone trunk -- SIP registration to a hosted PBX extension.
; Rendered from /etc/asterisk-templates/pjsip.conf at container start.

[voiptel-transport]
type = transport
protocol = tcp
; 5071 at VoIPTel's request: this is the port our Contact header advertises,
; so it is where the PBX delivers inbound INVITEs.
bind = 0.0.0.0:5071
external_media_address = ${PUBLIC_IP}
external_signaling_address = ${PUBLIC_IP}
local_net = 192.168.0.0/16
local_net = 172.16.0.0/12
local_net = 10.0.0.0/8

[voiptel-auth]
type = auth
auth_type = userpass
username = ${SIP_USER}
password = ${SIP_PASS}

[voiptel-reg]
type = registration
transport = voiptel-transport
outbound_auth = voiptel-auth
server_uri = sip:${REGISTRAR_HOST}:${REGISTRAR_PORT};transport=tcp
client_uri = sip:${SIP_USER}@${SIP_DOMAIN};transport=tcp
contact_user = ${SIP_USER}
expiration = ${REGISTRATION_EXPIRY}
retry_interval = 30
forbidden_retry_interval = 300
; line/endpoint bind inbound INVITEs arriving on this registration to the
; endpoint below, even when the source IP misses [voiptel] type=identify.
; That is the safety net for the PBX signalling from an address they did not
; document -- do not remove it to "clean up".
line = yes
endpoint = voiptel

[voiptel]
type = aor
contact = sip:${REGISTRAR_HOST}:${REGISTRAR_PORT};transport=tcp
qualify_frequency = 60

[voiptel]
type = endpoint
transport = voiptel-transport
context = from-voiptel
disallow = all
; ulaw is mandatory: Dograh's externalMedia channel is G.711 mu-law. An
; alaw-only or G.729-only negotiation connects and produces no usable audio.
allow = ulaw
allow = alaw
allow = g722
aors = voiptel
outbound_auth = voiptel-auth
from_user = ${SIP_USER}
from_domain = ${SIP_DOMAIN}
; direct_media=no is mandatory: with it on, RTP bypasses Asterisk and the
; externalMedia channel has nothing to tap.
direct_media = no
dtmf_mode = rfc4733
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[voiptel]
type = identify
endpoint = voiptel
; IDENTIFY_MATCHES
