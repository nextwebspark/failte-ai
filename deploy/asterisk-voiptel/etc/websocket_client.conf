; Asterisk dials OUT to Dograh for external media, which is why this setup
; needs no inbound reachability for the media leg.
;
; The section name is the "websocket_client.conf Name" field in the Dograh
; telephony configuration. Leaving that field empty in Dograh makes
; ari_manager deactivate the whole configuration.
;
; uri must be a base URL with NO query string: Dograh appends workflow_id,
; organization_id and workflow_run_id per call via transport_data=v(...).
[${STASIS_APP}]
type = websocket_client
uri = ${DOGRAH_WS_URI}
protocols = media
; For a wss:// uri, uncomment both lines -- tls_enabled is required even
; though the scheme already says TLS.
; tls_enabled = yes
; ca_list_file = /etc/ssl/certs/ca-certificates.crt
