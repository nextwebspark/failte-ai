; Inbound from the Voiptel / SkyPhone PBX.
;
; Deliberately a straight pass-through with no E.164 rewriting: the PBX
; presents short extensions (e.g. 7065), and Dograh stores those verbatim as
; address_type="sip_extension". Whatever string reaches Stasis() is what must
; be registered as the phone number in Dograh.

[general]
static = yes
writeprotect = no

[globals]

; ---------------------------------------------------------------------------
; Inbound
;
; INBOUND_MODE in .env selects what answers:
;   echo   -> Asterisk answers locally, plays a prompt, echoes audio back.
;             Proves SIP signalling and two-way RTP with Dograh out of the
;             picture. Use this for the first call with a new carrier.
;   stasis -> Hand the call to Dograh. Requires the backend running and a
;             telephony configuration with this extension registered.
; ---------------------------------------------------------------------------
[from-voiptel]
exten => _X.,1,NoOp(Voiptel inbound: to=${EXTEN} from=${CALLERID(num)} mode=${INBOUND_MODE})
 same => n,Set(CHANNEL(hangup_handler_push)=from-voiptel-hangup,s,1)
 same => n,Goto(voiptel-${INBOUND_MODE},${EXTEN},1)
 same => n,Hangup()

; Some PBXes send a Request-URI with no user part for a registration-bound
; extension. Route that to the extension we registered as.
exten => s,1,NoOp(Voiptel inbound with empty EXTEN, assuming ${SIP_USER})
 same => n,Goto(from-voiptel,${SIP_USER},1)

[voiptel-echo]
exten => _X.,1,NoOp(ECHO TEST for ${EXTEN} -- Dograh is not involved)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-congrats)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

[voiptel-stasis]
; Do NOT Answer() before Stasis(). ari_manager decides inbound vs outbound
; purely on channel state: StasisStart in "Ring" is inbound; an already
; answered channel arrives as "Up", is routed down the outbound path looking
; for appArgs that do not exist, and the call dies.
exten => _X.,1,NoOp(Handing ${EXTEN} to Dograh)
 same => n,Stasis(${STASIS_APP})
 same => n,Hangup()

[from-voiptel-hangup]
exten => s,1,NoOp(Voiptel call ended: ${CHANNEL} cause=${HANGUPCAUSE})
 same => n,Return()

; ---------------------------------------------------------------------------
; Outbound through the Voiptel trunk. Used for self-service testing (dial their
; test extension from the Asterisk CLI) and, later, for Dograh-originated calls
; when "From Extensions" is set on the telephony configuration.
; ---------------------------------------------------------------------------
[dograh-outbound]
exten => _X.,1,NoOp(Outbound via voiptel to ${EXTEN})
 same => n,Set(CALLERID(num)=${SIP_USER})
 same => n,Dial(PJSIP/${EXTEN}@voiptel,60)
 same => n,Hangup()
