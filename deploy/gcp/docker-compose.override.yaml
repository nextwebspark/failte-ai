# GCP app-VM overlay for the root docker-compose.yaml.
#
# Layered on top of the standard remote stack, so the normal installer flow
# still applies — this file only expresses what differs on GCP:
#
#   sudo ./setup_remote.sh
#   docker compose \
#     -f docker-compose.yaml \
#     -f deploy/gcp/docker-compose.override.yaml \
#     --profile remote up -d
#
# Export COMPOSE_FILE in the VM's shell profile so plain `docker compose ...`
# picks both files up and you cannot forget the overlay:
#   export COMPOSE_FILE=docker-compose.yaml:deploy/gcp/docker-compose.override.yaml
#
# Requires Compose v2.24+ for the `!reset` / `!override` merge tags.
#
# Images are pinned to one release version: LIGHTMOVE_VERSION in .env (X.Y.Z,
# no leading v), written by deploy/gcp/deploy.sh. The api, ui and fallcha-tools
# images of a release are built together by deploy/gcp/cloudbuild.yaml.

services:
  # ---------------------------------------------------------------------------
  # Postgres now lives in Cloud SQL (private IP, same VPC). Drop the container.
  # ---------------------------------------------------------------------------
  postgres: !reset null

  # ---------------------------------------------------------------------------
  # MinIO is deliberately KEPT even though storage is GCS.
  #
  # Two reasons, both practical:
  #   1. deploy/templates/nginx.remote.conf.template hardcodes
  #      `proxy_pass http://minio:9000/voice-audio/`. nginx resolves that name at
  #      startup and refuses to start if it does not exist, so removing the
  #      service breaks the whole ingress until that template is forked.
  #   2. It is the rollback path during the storage migration. Rows in
  #      workflow_runs / workflow_recordings carry a per-row storage_backend
  #      enum; until every row is flipped to 's3' and verified, MinIO must still
  #      be able to serve historical recordings.
  #
  # It is inert once ENABLE_AWS_S3=true: api/services/storage.py only constructs
  # MinioFileSystem for rows whose backend is 'minio', so the anonymous bucket
  # policy in api/services/filesystem/minio.py is never applied.
  #
  # Once the GCS cutover is verified and stable, remove MinIO *and* the
  # /voice-audio/ location from the nginx template together — not separately.
  # ---------------------------------------------------------------------------

  api:
    image: "${REGISTRY:?REGISTRY is required}/dograh-api:${LIGHTMOVE_VERSION:?LIGHTMOVE_VERSION is required (set by deploy/gcp/deploy.sh)}"
    # Upstream sets no restart policy on the core services, so after the
    # dograh-dev-hours 19:00 stop only the sidecars came back at 08:00.
    restart: unless-stopped
    environment:
      # The root compose file HARDCODES DATABASE_URL to the postgres container,
      # so a DATABASE_URL in .env is silently ignored. It must be overridden
      # here. Note the postgresql+asyncpg:// prefix — api/constants.py requires
      # the driver, a bare postgresql:// URL fails at startup.
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required — point it at the Cloud SQL private IP}"
      # botocore >= 1.36 sends a CRC32 checksum trailer on every PutObject;
      # GCS's S3 XML API rejects it with SignatureDoesNotMatch, so every
      # recording/transcript upload failed. Only checksum when an op requires it.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # Platform-managed models on this project's Vertex AI, Speech and TTS,
      # with the VM service account's credentials. Defaults here so a release
      # turns them on without a .env edit; .env (configure-env.sh) still wins,
      # e.g. PLATFORM_MODELS_ENABLED=false for the BYOK editor.
      PLATFORM_MODELS_ENABLED: "${PLATFORM_MODELS_ENABLED:-true}"
      PLATFORM_VERTEX_PROJECT_ID: "${PLATFORM_VERTEX_PROJECT_ID:-dograh-eu}"
    depends_on: !override
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Hosted tool providers (Google Calendar, Google Sheets, website catalogue).
  # Replaces the calendar-shim and chmarine-product-service sidecars; see
  # README.md "Tools service cutover". Internal only (no host ports): the api
  # reaches it at http://fallcha-tools:8000, and nginx forwards only
  # /oauth/<provider>/callback to it.
  # ---------------------------------------------------------------------------
  fallcha-tools:
    image: "${REGISTRY:?REGISTRY is required}/fallcha-tools:${LIGHTMOVE_VERSION:?LIGHTMOVE_VERSION is required (set by deploy/gcp/deploy.sh)}"
    # Always the released image, never a local build from ./tools.
    build: !reset null
    restart: unless-stopped
    # TOOLS_ENCRYPTION_KEYS, TOOLS_PUBLIC_BASE_URL, TOOLS_UI_RETURN_URL.
    # Written from Secret Manager by configure-env.sh; see tools.env.example.
    env_file:
      - ./deploy/gcp/secrets/tools.env
    # Replaces the root file's environment wholesale: keys set there would
    # otherwise win over env_file (with empty defaults).
    environment: !override
      # Same Cloud SQL database as the api; the service only touches its own
      # fallcha_tools schema.
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required — point it at the Cloud SQL private IP}"
      # Shared with the api service, so it lives in .env (one source).
      TOOLS_INTERNAL_SECRET: "${TOOLS_INTERNAL_SECRET:?TOOLS_INTERNAL_SECRET is required (16+ characters, same value as the api)}"
      LOG_LEVEL: "${TOOLS_LOG_LEVEL:-INFO}"
    # The postgres container is dropped above.
    depends_on: !reset {}

  # ---------------------------------------------------------------------------
  # The pre-tools-service agent sidecars, behind the `legacy-sidecars` profile.
  # They are needed during the tools cutover (README "Tools service cutover")
  # and for rolling it back. Turn them on from the VM's .env, not by editing
  # this file (deploy.sh refuses hand edits to tracked files):
  #   COMPOSE_PROFILES=remote,legacy-sidecars
  # and drop `legacy-sidecars` again once the cutover is verified. Their data
  # (catalogue.sqlite under /var/lib/dograh/chmarine) stays on disk.
  # ---------------------------------------------------------------------------
  calendar-shim:
    image: "${REGISTRY:?REGISTRY is required}/calendar-shim:${CALENDAR_SHIM_TAG:-latest}"
    container_name: calendar-shim
    profiles: ["legacy-sidecars"]
    restart: unless-stopped
    env_file:
      - ./deploy/gcp/secrets/calendar-shim.env
    volumes:
      - /etc/dograh/sa.json:/secrets/sa.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  chmarine-product-service:
    image: "${REGISTRY:?REGISTRY is required}/product-service:${PRODUCT_SERVICE_TAG:-latest}"
    container_name: chmarine-product-service
    profiles: ["legacy-sidecars"]
    restart: unless-stopped
    env_file:
      - ./deploy/gcp/secrets/product-service.env
    volumes:
      - /var/lib/dograh/chmarine:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  # Same reason as api: survive the scheduled VM stop/start and daemon restarts.
  ui:
    image: "${REGISTRY:?REGISTRY is required}/dograh-ui:${LIGHTMOVE_VERSION:?LIGHTMOVE_VERSION is required (set by deploy/gcp/deploy.sh)}"
    restart: unless-stopped
  nginx:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  minio:
    # The root file prefixes this with REGISTRY, which here is Artifact
    # Registry, where nothing mirrors MinIO. Pull it from Docker Hub instead.
    image: dograhai/minio:2026.09.22
    restart: unless-stopped
